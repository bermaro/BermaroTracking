tabGeneral = General
tabEvents = Events
tabPurchase = Order
tabConsent = Cookie bar & consent

generalActiveLabel = Tracking active in this store
generalContainerIdLabel = Google Tag Manager container ID (e.g. GTM-PKMRNKBW)
generalClientMappingLabel = Client mapping (optional, only if several stores share one plugin set). Format: plentyId=GTM-ID:format ; example: 22871=GTM-PKMRNKBW:felixries ; 12345=GTM-ABCDEFG:cfour
generalFormatsLabel = Data layer format (must match the Tag Manager container)
generalFormatFelixries = Like previous felixries.de plugin (lackier-bedarf.info)
generalFormatCfour = Like previous plugin on pelletgrill.rocks / B2B (globalValues, singleItemView, orderConfirmation ...)
generalFormatGa4 = GA4 standard (view_item, add_to_cart, purchase ...) – do NOT use in stores with Shoplytics (switched off automatically there)
generalIdSourceLabel = Which item ID to send? (must match the ID in the Google Shopping feed)
generalIdSourceVariationId = Variation ID
generalIdSourceItemId = Item ID
generalIdSourceVariationNumber = Variation number
generalAffiliationLabel = Store name for reports (empty = domain)
generalDebugLabel = Test mode: log all data layer pushes to the browser console

eventsEnabledLabel = Which events should be sent?
eventsItemList = Product lists (category and search pages)
eventsProductClick = Click on a product in a list
eventsItemView = Item detail page viewed
eventsCart = Add to / remove from basket
eventsWishlist = Add to wish list
eventsViewCart = Basket page viewed
eventsCheckout = Checkout (begin, shipping method, payment method)
eventsPurchase = Order completed (order confirmation)
eventsItemListOnAllPagesLabel = Also report product lists on other pages and in carousels (e.g. homepage)
eventsMaxListItemsLabel = Maximum number of items per product list (1 to 200)

purchaseValueBasisLabel = Which amount is the order value (orderValue / GA4 value)?
purchaseValueItemSumNet = Item value net (without shipping)
purchaseValueItemSumGross = Item value gross (without shipping)
purchaseValueTotalNet = Order total net (incl. shipping)
purchaseValueTotalGross = Order total gross (incl. shipping)
purchaseSendCustomerDataLabel = Send customer data for enhanced conversions (email, postcode, town, country – order confirmation only)
purchaseOnlyOnceLabel = Report each order only once (not again when the confirmation page is reloaded)

consentModeLabel = Google Consent Mode v2
consentModeOff = Off (e.g. if Shoplytics controls consent mode)
consentModeBasic = Basic (Tag Manager loads only after consent)
consentModeAdvanced = Advanced (Tag Manager always loads, Google receives consent status)
consentLoadGtmOnlyAfterConsentLabel = Load Tag Manager only after the visitor consented to at least one service (Analytics, Ads or Bing)
consentPushConsentChangedLabel = Send event "consentChanged" when the cookie bar selection changes
consentRegisterAnalyticsLabel = Register "Google Analytics" in the cookie bar
consentAnalyticsGroupLabel = Group for "Google Analytics"
consentAnalyticsKeyLabel = Technical key "Google Analytics"
consentRegisterAdsLabel = Register "Google Ads" in the cookie bar
consentAdsGroupLabel = Group for "Google Ads"
consentAdsKeyLabel = Technical key "Google Ads"
consentRegisterBingLabel = Register "Microsoft Advertising (Bing)" in the cookie bar
consentBingGroupLabel = Group for "Microsoft Advertising (Bing)"
consentBingKeyLabel = Technical key "Microsoft Advertising (Bing)"
consentGroupTracking = Statistics
consentGroupMarketing = Marketing
