tabGeneral = Allgemein
tabEvents = Ereignisse
tabPurchase = Bestellung
tabConsent = Cookie-Banner & Consent

generalActiveLabel = Tracking in diesem Shop aktiv
generalContainerIdLabel = Google-Tag-Manager-Container-ID (z. B. GTM-PKMRNKBW)
generalClientMappingLabel = Mandanten-Zuordnung (optional, nur wenn sich mehrere Shops ein Plugin-Set teilen). Schreibweise: plentyId=GTM-ID:format ; Beispiel: 22871=GTM-PKMRNKBW:felixries ; 12345=GTM-ABCDEFG:cfour
generalFormatsLabel = Datenformat im dataLayer (muss zum Tag-Manager-Container passen)
generalFormatFelixries = Wie bisheriges Plugin von felixries.de (lackier-bedarf.info)
generalFormatCfour = Wie bisheriges Plugin auf pelletgrill.rocks / B2B (globalValues, singleItemView, orderConfirmation ...)
generalFormatGa4 = GA4-Standard (view_item, add_to_cart, purchase ...) – NICHT in Shops mit Shoplytics verwenden (wird dort automatisch abgeschaltet)
generalIdSourceLabel = Welche Artikel-ID übertragen? (muss zur ID im Google-Shopping-Feed passen)
generalIdSourceVariationId = Varianten-ID (wie bisher auf lackier-bedarf.info)
generalIdSourceItemId = Artikel-ID
generalIdSourceVariationNumber = Variantennummer
generalAffiliationLabel = Shop-Name für Berichte (leer = Domain)
generalDebugLabel = Testmodus: Alle Übertragungen in der Browser-Konsole anzeigen

eventsEnabledLabel = Welche Ereignisse übertragen?
eventsItemList = Produktlisten (Kategorie- und Suchseiten)
eventsProductClick = Klick auf ein Produkt in einer Liste
eventsItemView = Artikeldetailseite angesehen
eventsCart = In den Warenkorb / aus dem Warenkorb
eventsWishlist = Auf den Wunschzettel
eventsViewCart = Warenkorbseite angesehen
eventsCheckout = Kasse (Beginn, Versandart, Zahlungsart)
eventsPurchase = Bestellung abgeschlossen (Bestellbestätigung)
eventsItemListOnAllPagesLabel = Produktlisten auch auf anderen Seiten und in Karussells melden (z. B. Startseite)
eventsMaxListItemsLabel = Höchstzahl Artikel je Produktliste (1 bis 200)

purchaseValueBasisLabel = Welcher Betrag gilt als Bestellwert (orderValue / GA4-value)?
purchaseValueItemSumNet = Warenwert netto (ohne Versand)
purchaseValueItemSumGross = Warenwert brutto (ohne Versand)
purchaseValueTotalNet = Gesamtbetrag netto (mit Versand)
purchaseValueTotalGross = Gesamtbetrag brutto (mit Versand)
purchaseSendCustomerDataLabel = Kundendaten für "Erweiterte Conversions" übergeben (E-Mail, PLZ, Ort, Land – nur auf der Bestellbestätigung)
purchaseOnlyOnceLabel = Jede Bestellung nur einmal melden (kein zweites Mal beim Neuladen der Bestätigungsseite)

consentModeLabel = Google Consent Mode v2
consentModeOff = Aus (Google erhält vom Plugin keinen Einwilligungsstatus)
consentModeBasic = Basic (Tag Manager lädt erst nach einer Einwilligung)
consentModeAdvanced = Advanced (empfohlen bei Shoplytics: Tag Manager lädt immer, Google erhält den echten Einwilligungsstatus)
consentLoadGtmOnlyAfterConsentLabel = Tag Manager erst laden, wenn der Besucher mindestens einem Dienst zugestimmt hat (Analytics, Ads oder Bing)
consentPushConsentChangedLabel = Bei Änderung im Cookie-Banner das Ereignis "consentChanged" senden (wie bisher)
consentRegisterAnalyticsLabel = Eintrag "Google Analytics" im Cookie-Banner anlegen
consentAnalyticsGroupLabel = Gruppe für "Google Analytics"
consentAnalyticsKeyLabel = Technischer Schlüssel "Google Analytics" (lackier-bedarf: googleanalytics / pelletgrill + B2B: gtmGoogleAnalytics)
consentRegisterAdsLabel = Eintrag "Google Ads" im Cookie-Banner anlegen
consentAdsGroupLabel = Gruppe für "Google Ads"
consentAdsKeyLabel = Technischer Schlüssel "Google Ads" (lackier-bedarf: googleads / pelletgrill + B2B: gtmGoogleAds)
consentRegisterBingLabel = Eintrag "Microsoft Advertising (Bing)" im Cookie-Banner anlegen
consentBingGroupLabel = Gruppe für "Microsoft Advertising (Bing)"
consentBingKeyLabel = Technischer Schlüssel "Microsoft Advertising (Bing)" (lackier-bedarf: bingads)
consentGroupTracking = Statistik
consentGroupMarketing = Marketing
